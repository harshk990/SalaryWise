name: Build and launch-test SalaryWise APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK using the official Android Gradle Plugin
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Launch test on Android emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.salarywise.android/.MainActivity
            sleep 8
            adb shell pidof com.salarywise.android
            adb logcat -d -s AndroidRuntime:E > android-runtime.txt
            if grep -q 'FATAL EXCEPTION' android-runtime.txt; then
              cat android-runtime.txt
              exit 1
            fi
            adb exec-out screencap -p > salarywise-launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: SalaryWise-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            salarywise-launch.png
          if-no-files-found: error
