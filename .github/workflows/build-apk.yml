name: Build and package SalaryWise Android APK (Java 17 / Android 15/17)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SalaryWise-Official-Android-Studio-Project-1/SalaryWise-OfficialBuild

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Licenses & Install Android 35 SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK via Android Gradle Plugin
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SalaryWise-v1.0.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalaryWise-Mobile-APK
          path: SalaryWise-Official-Android-Studio-Project-1/SalaryWise-OfficialBuild/app/build/outputs/apk/debug/SalaryWise-v1.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "SalaryWise Android App (APK v1.0.0)"
          body: |
            ### SalaryWise Android App for Android 15/17 & Java 17
            Download and install `SalaryWise-v1.0.apk` directly on your mobile device.
            - **Target**: Android 15/17 (API 35, Java 17)
            - **Security**: 100% Offline & Private (Local WebView Storage)
            - **Features**: Custom Salary Account balance, Purchase Affordability evaluation, and mobile bottom sheet UX.
          files: SalaryWise-Official-Android-Studio-Project-1/SalaryWise-OfficialBuild/app/build/outputs/apk/debug/SalaryWise-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
